<td><button class="star" [attr.aria-label]="'Watch ' + a.symbol" [attr.aria-pressed]="isWatched" (click)="watch(a.id)">{{isWatched ? '★' : '☆'}}</button></td><td><button class="asset" (click)="select(a.id)"><b>{{a.symbol}}</b><small>{{a.name}}</small></button></td><td><span class="sector">{{a.sector}}</span></td><td class="numeric price">{{a.price / 100 | number:'1.2-2'}}</td><td class="numeric" [class.green]="a.price >= a.base" [class.red]="a.price < a.base">{{(a.price - a.base) / a.base * 100 | number:'1.2-2'}}%</td><td class="numeric muted">{{a.volume | number}}</td>
